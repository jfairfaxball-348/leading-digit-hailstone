name: lean

on:
  push:
    branches: [main, "pilot/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          nanoda: false
      - name: Resolve Lean dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Lean specification
        run: lake build
      - name: Reject sorry placeholders
        run: |
          if grep -R -n -E '\bsorry\b' LeadingDigitHailstone.lean LeadingDigitHailstone; then
            echo "Lean source contains a sorry placeholder."
            exit 1
          fi
