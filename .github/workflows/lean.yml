name: lean

on:
  push:
    branches: [main, "pilot/**", "research/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Lean dependencies
        run: lake update
      - name: Require committed manifest to be current
        run: git diff --exit-code -- lake-manifest.json
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Lean specification and Palomar modules
        run: lake build
      - name: Reject sorry placeholders outside Challenge
        run: |
          if grep -R -n -E '\bsorry\b' LeadingDigitHailstone.lean LeadingDigitHailstone Solution.lean; then
            echo "Substantive Lean source or Solution contains a sorry placeholder."
            exit 1
          fi
      - name: Install bubblewrap for lake comparator
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Palomar-style local Comparator check
        run: ./scripts/verify-comparator.sh
