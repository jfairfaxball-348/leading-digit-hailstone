name: lean

on:
  push:
    branches: [main, "pilot/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1.5.0
        with:
          build: true
          nanoda: true
          nanoda-allow-sorry: false
